<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <span id="top" class="top-anchor" aria-hidden="true"></span>
    <nav class="navbar">
      <a id="site-title" class="site-title" href="#top">Portfolio Gallery</a>
      <div class="nav-links">
        <a href="#works-section">Works</a>
        <a href="#about">About</a>
        <a href="#top">Contact</a>
      </div>
    </nav>

    <header class="hero">
      <div id="avatar" class="avatar-placeholder" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="eyebrow">Portfolio Library</p>
        <h1 id="display-name">Portfolio Gallery</h1>
        <p id="bio" class="bio"></p>
        <div id="creator-tags" class="tag-row"></div>
        <div id="contact-buttons" class="contact-row"></div>
      </div>
    </header>

    <main class="container">
      <section id="featured-section" class="section-block">
        <div class="section-heading">
          <p class="eyebrow">Selected</p>
          <h2>Featured Works</h2>
        </div>
        <div id="featured-grid" class="featured-grid"></div>
      </section>

      <section id="works-section" class="section-block">
        <div class="section-heading">
          <p class="eyebrow">Archive</p>
          <h2>Works Gallery</h2>
        </div>
        <div id="filter-controls" class="filter-controls"></div>
        <div id="works-grid" class="works-grid"></div>
      </section>

      <section id="about" class="about-section">
        <div>
          <p class="eyebrow">About</p>
          <h2 id="about-name">Creator</h2>
        </div>
        <p id="license-text"></p>
      </section>
    </main>

    <footer class="footer">
      <span>&copy; <span id="year"></span> <span id="footer-name">Creator</span></span>
      <span>Generated by Portfolio Library</span>
    </footer>

    <div id="work-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-backdrop" data-close-modal></div>
      <article class="modal-panel">
        <button id="modal-close" class="modal-close" type="button" aria-label="Close work details">&times;</button>
        <div id="modal-content"></div>
      </article>
    </div>

    <div id="contact-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
      <div class="modal-backdrop" data-close-contact></div>
      <article class="contact-modal-panel">
        <button id="contact-modal-close" class="modal-close" type="button" aria-label="Close contact details">&times;</button>
        <div id="contact-modal-content"></div>
      </article>
    </div>

    <script>
      window.__CREATOR_DATA__ = __CREATOR_DATA_JSON__;
    </script>
    <script src="main.js"></script>
  </body>
</html>
