<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Library</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f2ea;
        --paper: #fffaf4;
        --ink: #201815;
        --soft: #665d57;
        --accent: #bc3a28;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(188, 58, 40, 0.1), transparent 35%),
          radial-gradient(circle at 82% 40%, rgba(39, 53, 93, 0.08), transparent 28%),
          var(--bg);
        color: var(--ink);
        font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 48px));
        border: 1px solid rgba(32, 24, 21, 0.1);
        background: rgba(255, 250, 244, 0.86);
        padding: 36px;
        box-shadow: 0 24px 70px rgba(32, 24, 21, 0.1);
      }

      h1 {
        margin: 0 0 14px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 42px;
        font-weight: 400;
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--soft);
        line-height: 1.7;
      }

      #status {
        margin-top: 24px;
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portfolio Library</h1>
      <p>Starting the local database and workspace API.</p>
      <p id="status">Preparing desktop runtime...</p>
    </main>
  </body>
</html>
